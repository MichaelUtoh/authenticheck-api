services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: authenticheck
      POSTGRES_PASSWORD: authenticheck
      POSTGRES_DB: authenticheck
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authenticheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build:
      context: .
      args: { REQUIREMENTS: dev }
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://authenticheck:authenticheck@db:5432/authenticheck
      REDIS_URL: redis://redis:6379/0
    volumes: [".:/app"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build:
      context: .
      args: { REQUIREMENTS: dev }
    command: celery -A config worker -l info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://authenticheck:authenticheck@db:5432/authenticheck
      REDIS_URL: redis://redis:6379/0
    volumes: [".:/app"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  pgdata:
